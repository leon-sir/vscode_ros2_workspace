controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    effort_controller:
      type: effort_controllers/JointGroupEffortController

effort_controller:
  ros__parameters:
    joints:
      - jleftfront 
joint_state_broadcaster:
  ros__parameters:
    joints:
      - jleftfront 
    use_sim_time: true
    use_urdf_to_filter: true
    interfaces:
      - position
      - velocity
      - effort
    map_interface_to_joint_state:
      effort: effort
      position: position
      velocity: velocity